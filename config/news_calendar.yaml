# news_calendar.yaml - scheduled market-moving releases for the news regime agent.
#
# Any `impact: high` event dated TODAY (US/Eastern calendar day) makes the whole day
# CAUTIOUS - half size. The calendar can only ADD caution: a day not listed here is not
# evidence of calm, so on other days this layer abstains and the live layers vote.
# Times are US/Eastern and informational (the vote is per day).
#
# SOURCE. Generated 2026-11-16 from the official schedules as bundled in
# risk-aware-trading-agents (MIT, see NOTICE), pinned at commit 3cf41fb:
#   FOMC decisions     federalreserve.gov/monetarypolicy/fomccalendars.htm  - through 2027-12-08
#                      (decision = the meeting's 2nd day, statement 14:00 ET)
#   CPI, jobs, PPI     bls.gov/schedule/news_release/ (08:30 ET)            - through 2026-12
#   PCE / GDP          bea.gov/news/schedule                                - not listed yet
#
# KEEP IT CURRENT: add 2027 CPI / jobs / PPI dates from the BLS schedule when it is
# published. PPI is `medium` - recorded, not a caution trigger - until the forward
# record shows its days differ; impact levels are to be MEASURED, not assumed.
events:
  - {date: "2026-12-04", time_et: "08:30", event: "Jobs report (NFP)", impact: high}
  - {date: "2026-12-09", time_et: "14:00", event: "FOMC rate decision + projections", impact: high}
  - {date: "2026-12-10", time_et: "08:30", event: "CPI release", impact: high}
  - {date: "2026-12-15", time_et: "08:30", event: "PPI release", impact: medium}
  - {date: "2027-01-27", time_et: "14:00", event: "FOMC rate decision", impact: high}
  - {date: "2027-03-17", time_et: "14:00", event: "FOMC rate decision + projections", impact: high}
  - {date: "2027-04-28", time_et: "14:00", event: "FOMC rate decision", impact: high}
  - {date: "2027-06-09", time_et: "14:00", event: "FOMC rate decision + projections", impact: high}
  - {date: "2027-07-28", time_et: "14:00", event: "FOMC rate decision", impact: high}
  - {date: "2027-09-15", time_et: "14:00", event: "FOMC rate decision + projections", impact: high}
  - {date: "2027-10-27", time_et: "14:00", event: "FOMC rate decision", impact: high}
  - {date: "2027-12-08", time_et: "14:00", event: "FOMC rate decision + projections", impact: high}
