# Kalshi 15-min asset registry.
#
# Each entry maps an asset shortname to its Kalshi series ticker and
# the Binance.US ticker we use for indicator data.
#
# To add a new asset: append a key, find the series via
#   `python -c "from lib.kalshi_15min_signal import probe_series; probe_series()"`
# (or browse https://api.elections.kalshi.com/trade-api/v2/series?category=Crypto)
# and pick the matching Binance.US pair.
#
# Phase 2 (paper-trade) uses these uniformly. Phase 3 (real orders)
# will respect the per-asset ``min_confidence`` override below — ETH
# and SOL have wider Kalshi spreads + thinner liquidity than BTC, so
# we require a higher composite confidence before firing.

# ``annual_vol`` feeds the Greeks-based theoretical-delta indicator.
# Tune from realized vol when we have enough data; defaults below come
# from rolling 30-day realized-vol estimates as of mid-2026.
#   * BTC ~50-60% — settle around 0.55
#   * ETH ~60-70% — more reactive
#   * SOL ~80-100% — substantially noisier
# Hermes-style tuning can drift these later from per-asset realized.

assets:
  btc:
    series: KXBTC15M
    binance_symbol: BTCUSDT
    annual_vol: 0.55
    # Tightened 2026-05-18 from 0.35 → 0.65 based on 39-trade evidence.
    # 2026-05-20: tightened again 0.65 → 0.70 after re-analyzing the
    # full 55-trade history broken down by confidence bucket:
    #   ≥0.80:     n=3   WR=100.0%  pnl=+$3.96   ← ideal cohort
    #   0.70-0.80: n=8   WR= 87.5%  pnl=+$6.85   ← actual edge zone
    #   0.60-0.70: n=7   WR= 28.6%  pnl=-$23.06  ← LEAKY BAND (was killing P&L)
    #   <0.60:     n=37  WR= 67.6%  pnl=-$21.35  ← high WR / negative on noise
    # The 0.65 cutoff still admitted the leaky 0.60-0.70 band; raising
    # to 0.70 caps trade frequency at the n=11 high-quality cohort
    # (≥0.70). Bot will fire far less often but each fire is much
    # more likely to be profitable. Revisit after 30 more settled
    # trades at the new threshold.
    min_confidence: 0.70
    enabled: true
    # Kronos foundation-model 5th signal. Adds P(close > strike) from
    # Monte Carlo path simulation as an orthogonal vote on top of the
    # four base indicators. Adapted from the Kronos paper (arXiv:2508.02739)
    # where short-horizon forecasting was the model's strongest task
    # (44% MAE reduction). Default ON for BTC because:
    #   • Kronos paper explicitly validated on BTC + crypto
    #   • horizon (5m × 3 = 15min) matches Kalshi's resolution window
    #   • ~6-10s/call is fine at 60s scanner cadence with 5-min cache
    # Disable via enabled=false if Kronos weights aren't downloaded.
    kronos:
      enabled: true
      horizon_bars: 3       # 3 × 5min = 15min (matches Kalshi window)
      interval: "5m"        # 5m bars feed Kronos (less noise than 1m)
      sample_count: 10      # paper Table 6 default
      weight: 3.0           # composite weight (max becomes 15.0 vs base 12.0)
      ticker: "BTC-USD"     # Kronos ticker symbol
    # Order-flow imbalance from Binance.US top-N book. Signed [-1, +1]
    # microstructure signal — orthogonal to the four base indicators
    # (none see the resting limit book). Lighter weight than Kronos
    # because OFI is noisier minute-to-minute.
    orderflow:
      enabled: true
      symbol: "BTCUSDT"
      depth_levels: 10      # top-10 levels of book
      weight: 2.0           # composite weight (max becomes 17.0 with Kronos)

  eth:
    series: KXETH15M
    binance_symbol: ETHUSDT
    annual_vol: 0.65
    min_confidence: 0.45      # ETH spreads ~2x wider than BTC on Kalshi
    enabled: false            # disabled 2026-05-15 — ETH was 3W/5L=38%
                              # in initial sample. Re-enable after BTC
                              # alone proves consistent.

  sol:
    series: KXSOL15M
    binance_symbol: SOLUSDT
    annual_vol: 0.85
    min_confidence: 0.50      # thinnest of the three — most conservative
    enabled: false            # disabled 2026-05-15 — SOL was 3W/5L=38%
                              # and has thinnest liquidity. Re-enable
                              # after BTC alone proves consistent.

  # Below: confirmed-available but not enabled by default.
  # Flip ``enabled: true`` once the first three prove out.

  ada:
    series: KXADA15M
    binance_symbol: ADAUSDT
    annual_vol: 0.85
    min_confidence: 0.55
    enabled: false

  xrp:
    series: KXXRP15M
    binance_symbol: XRPUSDT
    annual_vol: 0.85
    min_confidence: 0.55
    enabled: false

  doge:
    series: KXDOGE15M
    binance_symbol: DOGEUSDT
    annual_vol: 1.20          # DOGE is wildly volatile — 100%+ annualized
    min_confidence: 0.60
    enabled: false
