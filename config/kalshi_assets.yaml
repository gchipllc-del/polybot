# Kalshi 15-min asset registry.
#
# Each entry maps an asset shortname to its Kalshi series ticker and
# the Binance.US ticker we use for indicator data.
#
# To add a new asset: append a key, find the series via
#   `python -c "from lib.kalshi_15min_signal import probe_series; probe_series()"`
# (or browse https://api.elections.kalshi.com/trade-api/v2/series?category=Crypto)
# and pick the matching Binance.US pair.
#
# Phase 2 (paper-trade) uses these uniformly. Phase 3 (real orders)
# will respect the per-asset ``min_confidence`` override below — ETH
# and SOL have wider Kalshi spreads + thinner liquidity than BTC, so
# we require a higher composite confidence before firing.

# ``annual_vol`` feeds the Greeks-based theoretical-delta indicator.
# Tune from realized vol when we have enough data; defaults below come
# from rolling 30-day realized-vol estimates as of mid-2026.
#   * BTC ~50-60% — settle around 0.55
#   * ETH ~60-70% — more reactive
#   * SOL ~80-100% — substantially noisier
# Hermes-style tuning can drift these later from per-asset realized.

assets:
  btc:
    series: KXBTC15M
    binance_symbol: BTCUSDT
    annual_vol: 0.55
    # Confidence-threshold history:
    #   2026-05-18: 0.35 → 0.65 (cut <0.60 leaky band)
    #   2026-05-19 AM: 0.65 → 0.70 (chasing the 0.70-0.80 edge cohort)
    #   2026-05-19 mid: 0.70 → 0.55 — 0 trades in 19h (still too tight)
    #   2026-05-19 PM: 0.55 → 0.40 — analyzed 858 signals over 18h:
    #     conf >= 0.40 + fill <= 0.45: 11 signals (~14 trades/day) projected
    #   2026-05-20 PM: 0.40 → 0.35 — 0 trades fired in 48 hours at 0.40.
    #     After dead signals (kronos+funding) disabled, max_possible
    #     dropped to 15.0. With rsi weight bumped to 3.0, the active
    #     base composite can still reach max ~14, but realistic
    #     contradicting-indicator readings cap composite around 5-6.
    #     0.40 × 15 = 6 composite needed — almost never hit. 0.35 ×
    #     15 = 5.25 → small but real population of trades clears it.
    #     R:R gate (fill ≤ 0.45) still doing the structural protection.
    #   2026-05-20 EOD: 0.35 → 0.25 — signal_replay across 6 days of
    #     historical data with new config (max $5 / composite<8 /
    #     min_secs 120) shows: 0.25 conf → 34 trades, 65% WR, +250% ROI
    #     net of estimated 7% Kalshi profit fee. Picks up 4x more trades
    #     than 0.35 while keeping ROI positive. Path to 200 paper trades
    #     shrinks from ~110 days to ~35 days.
    #   2026-05-23: 0.25 → 0.30 — first 4 live trades at conf in
    #     [0.28, 0.53] went 0-for-4 (all directionally wrong vs the
    #     Kalshi-confirmed resolutions). 2 of 4 had conf below the prior
    #     0.35 threshold — quality dropped below the throughput gain.
    #     Splitting the difference at 0.30 to keep most of the new-trade
    #     pickup while filtering the weakest cohort. Re-evaluate after
    #     20 more trades.
    min_confidence: 0.30
    enabled: true
    # Kronos foundation-model 5th signal. Adds P(close > strike) from
    # Monte Carlo path simulation as an orthogonal vote on top of the
    # four base indicators. Adapted from the Kronos paper (arXiv:2508.02739)
    # where short-horizon forecasting was the model's strongest task
    # (44% MAE reduction). Default ON for BTC because:
    #   • Kronos paper explicitly validated on BTC + crypto
    #   • horizon (5m × 3 = 15min) matches Kalshi's resolution window
    #   • ~6-10s/call is fine at 60s scanner cadence with 5-min cache
    # Disable via enabled=false if Kronos weights aren't downloaded.
    # 2026-05-19 PM: DISABLED Kronos. Empirical: across last 50
    # signal samples, kronos contribution was 0.000 average AND
    # 0.000 max — the small model + N=5 + 15-min horizon produces
    # p_yes ≈ 0.50 every time (no opinion). It adds 3.0 weight to
    # max_possible without contributing any composite, dragging
    # confidence ratios down by ~16%. Re-enable when we have
    # capacity to run base model + N=10 (slower but maybe useful).
    kronos:
      enabled: false        # contributing nothing — see note above
      horizon_bars: 3
      interval: "5m"
      sample_count: 5
      weight: 3.0
      ticker: "BTC-USD"
      model_size: "small"
    # Order-flow imbalance from Binance.US top-N book. Signed [-1, +1]
    # microstructure signal — orthogonal to the four base indicators
    # (none see the resting limit book). Lighter weight than Kronos
    # because OFI is noisier minute-to-minute.
    orderflow:
      enabled: true
      symbol: "BTCUSDT"
      depth_levels: 10      # top-10 levels of book
      weight: 2.0           # composite weight (max becomes 17.0 with Kronos)
    # Funding-rate divergence — BTC perpetual-futures funding from Binance.
    # REVERSAL signal: high funding (long bias) → bearish; negative →
    # bullish. Updates every 8h so cached aggressively. Lighter weight
    # than the others because it's slow-moving and mainly a "watch out"
    # signal rather than a primary call.
    # 2026-05-19 PM: DISABLED. BTC funding has been ~+0.005%/8h
    # (~+5.4%/yr annualized) — sits inside the neutral zone of our
    # ±0.01% mild threshold. Across last 50 samples: 0.000 contribution
    # every time. Was dragging confidence ratios down by ~8%. Re-enable
    # with looser thresholds (~±0.005% mild) if we want a slow-moving
    # secondary signal again.
    funding_rate:
      enabled: false
      symbol: "BTCUSDT"
      weight: 1.5

  # ─── ALL NON-BTC ASSETS DISABLED 2026-05-21 EVENING ────────────────
  # Reason: 60-trade audit showed BTC has real edge (43 trades, 77% WR,
  # +$4.31 net) while ETH and SOL bleed (8 trades each, 25% WR, -$24
  # and -$28 respectively). The composite formula + indicator weights
  # were implicitly tuned for BTC microstructure; other assets show
  # systematic miscalibration. Re-enable each individually only after:
  #
  #   1. Backtest harness replays ≥30 days of the asset's historical
  #      quotes + spot bars through the current gate logic. Net P&L
  #      must be positive after a 7% Kalshi profit fee.
  #   2. EITHER (a) tune asset-specific gate thresholds (min_confidence,
  #      MIN_SPOT_STRIKE_GAP_PCT, MAX_FILL_FOR_BUY) so the replay clears
  #      the bar, OR (b) confirm the asset already does without tuning.
  #   3. Then re-enable here with a target of 20+ paper trades to
  #      validate the backtest's predictions before any live exposure.
  #
  # Until then: BTC alone runs. Frequency is lower but edge is real.

  eth:
    series: KXETH15M
    binance_symbol: ETHUSDT
    annual_vol: 0.65
    min_confidence: 0.45
    # 2026-05-21 PM: paused — pre-fix-era data showed 25% WR / -$24 P&L
    # over 8 trades. Need backtest-validated retune before re-enable.
    enabled: false

  sol:
    series: KXSOL15M
    binance_symbol: SOLUSDT
    annual_vol: 0.85
    min_confidence: 0.50
    # 2026-05-21 PM: paused — 25% WR / -$28 P&L over 8 trades.
    enabled: false

  ada:
    series: KXADA15M
    binance_symbol: ADAUSDT
    annual_vol: 0.85
    min_confidence: 0.55
    # 2026-05-21 PM: paused — never produced a trade (no live markets
    # observed). Re-enable when Kalshi starts issuing ADA 15-min markets
    # AND we have asset-specific gate validation.
    enabled: false

  xrp:
    series: KXXRP15M
    binance_symbol: XRPUSDT
    annual_vol: 0.85
    min_confidence: 0.55
    # 2026-05-21 PM: paused — no asset-specific validation yet.
    enabled: false

  doge:
    series: KXDOGE15M
    binance_symbol: DOGEUSDT
    annual_vol: 1.20
    min_confidence: 0.60
    # 2026-05-21 PM: paused — no asset-specific validation yet. DOGE's
    # 100%+ annualized vol means the BSM model assumptions need their
    # own re-derivation; can't reuse BTC tuning.
    enabled: false
