  lax:
    label: "Los Angeles (LAX)"
    station: KLAX
    lat: 33.9381
    lon: -118.3889
    aliases: ["KXHIGHLAX", "LOS ANGELES", "LAX"]
    enabled: true

  phil:
    label: "Philadelphia (PHL)"
    station: KPHL
    lat: 39.8729
