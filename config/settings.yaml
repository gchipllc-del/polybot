# ============================================================
# POLYBOT — RUNTIME SETTINGS (SECURITY CRITICAL)
# ============================================================

# --- Mode ---
mode: manifold           # manifold (paper) | kalshi | polymarket | all
live_migration_approved: false   # Requires manual flip for real-money platforms

# --- Active Platforms ---
platforms:
  kalshi:
    enabled: false        # Enable when API key is ready
  polymarket:
    enabled: false        # Enable when wallet is funded
  manifold:
    enabled: true         # Paper trading — always on for testing

# --- Circuit Breakers ---
circuit_breakers:
  # Two layers — whichever is more lenient wins:
  #   max_daily_loss      : hard dollar floor (last-resort absolute stop)
  #   max_daily_loss_pct  : bankroll-relative ceiling (auto-scales)
  # Original -10 floor was calibrated to a $50 bankroll. Bankroll grew to
  # ~$739 by 2026-04-30 and the absolute floor was tripping false-positive
  # daily; pct rule now does the live work (10% of $739 ≈ -$73.90).
  max_daily_loss: -50             # absolute floor — never let losses exceed this
  max_daily_loss_pct: -0.10       # bankroll-relative ceiling (10%)
  max_per_market_pct: 0.15        # 15% of bankroll per market
  max_category_pct: 0.40          # 40% in any single category
  # NOTE: position-count gate of record is strategy.yaml `growth.max_concurrent_positions`
  # (phase-scoped). This breaker is a defense-in-depth absolute ceiling.
  max_open_positions: 10          # Max concurrent positions (defense-in-depth)
  max_quantity_per_order: 5000    # Max contracts per order (Manifold uses mana, not contracts)
  cooldown_after_loss_minutes: 30 # Cooldown after losing trade
  min_market_volume: 10           # Min 24h volume (Manifold play money; raise for real platforms)
  max_resolution_date_pct: 0.25   # Max 25% of bankroll resolving same date

# --- Monitoring ---
monitoring:
  check_interval_seconds: 120    # 2 minutes (prediction markets move fast)
  missed_check_alert: 3
  missed_check_kill: 10

# --- Hermes Optimization ---
hermes:
  enabled: true
  lookback_days: 14
  min_trades_to_optimize: 5      # Need 5+ resolved trades before tuning

# --- Rate Limiting ---
rate_limits:
  kalshi_calls_per_minute: 60
  polymarket_calls_per_minute: 120
  manifold_calls_per_minute: 120
  # --- LLM providers (one bucket per provider) ---
  anthropic_calls_per_minute: 30     # Claude
  deepseek_calls_per_minute: 30      # DeepSeek (usually generous limits)
  moonshot_calls_per_minute: 30      # Kimi / Moonshot
  backoff_base_seconds: 2
  backoff_max_seconds: 60

# --- Notifications ---
notifications:
  telegram_enabled: false         # Enable when bot token is set
  alert_on:
    - order_filled
    - order_rejected
    - circuit_breaker_triggered
    - market_resolved
    - kill_switch_activated
    - daily_summary
    - missed_monitoring_check
    - calibration_report
