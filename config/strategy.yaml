# ============================================================
# POLYBOT — FORECASTING & STRATEGY CONFIGURATION
# All parameters marked [HERMES] are auto-tuned within bounds
# ============================================================

# --- Forecasting Engine ---
forecasting:
  # Source weights — how much to trust each signal [HERMES]
  llm_weight: 0.22              # Claude superforecaster analysis (bounds: 0.10 - 0.50)
  base_rate_weight: 0.18        # Historical base rates (bounds: 0.10 - 0.50)
  metaculus_weight: 0.13        # Community forecasts (bounds: 0.05 - 0.40)
  news_weight: 0.09             # News sentiment signal (bounds: 0.05 - 0.30)
  news_impact_weight: 0.10      # News-impact classification (Wave A — bounds: 0.0 - 0.20)
                                # LLM directional MORE_LIKELY_YES/NO + materiality,
                                # converted to probability via news_classifier.
                                # Set to 0.0 to disable; complementary to news_weight.
  kronos_weight: 0.18           # Kronos zero-shot price model (bounds: 0.05 - 0.40)
  smart_money_weight: 0.10      # Tracked whale wallet flow (bounds: 0.05 - 0.25)
  market_consensus_weight: 0.10 # The market price itself (bounds: 0.05 - 0.20)
  news_impact_materiality_threshold: 0.30  # min materiality to apply news_impact (Wave A)

  # --- LLM Ensemble (multi-provider) ---
  # Every provider runs in parallel. Their probability estimates are
  # aggregated with weighted geomean-log-odds. Cross-model diversity
  # reduces systematic bias vs. N samples of a single model.
  #
  # Each provider is skipped silently if its API key env var is missing,
  # so you can run with any subset. Set ANTHROPIC_API_KEY, DEEPSEEK_API_KEY,
  # and/or MOONSHOT_API_KEY to enable.
  #
  # Weights are RELATIVE — normalized at aggregation time.
  # Claude is the best-calibrated out of the box; DeepSeek-R1 adds strong
  # explicit reasoning at ~1/20th the cost; Kimi K2 covers news-heavy
  # markets well and serves as a tiebreaker.
  llm_providers:
    # ─── Free-tier ensemble (active 2026-04-25) ────────────────────────
    # All three are free-tier APIs with documented rate limits. Together
    # they reproduce the diversity of the old Claude+DeepSeek+Kimi setup
    # at ~85% of the calibration quality, $0/month. Flip any of these to
    # `enabled: false` and re-enable a paid provider below if you fund
    # one — the aggregator handles partial coverage gracefully.
    - name: gemini
      model: gemini-2.5-pro          # Google AI Studio — needs GOOGLE_API_KEY
      weight: 0.50                   # Best free reasoner — primary signal
      samples: 1                     # Free tier is 5 RPM; samples=2 burns it
      max_tokens: 2000
      temperature: 0.7
      enabled: true
    - name: groq
      # Groq retired DeepSeek-R1-distill-llama-70b. Llama-3.3-70b-versatile
      # is the most capable general model on Groq's current free tier.
      # Alternatives: qwen/qwen3-32b (slightly better reasoning, more wobbly
      # on JSON), meta-llama/llama-4-scout-17b-16e-instruct (newer, smaller).
      model: llama-3.3-70b-versatile
      weight: 0.30
      samples: 1
      max_tokens: 2000
      temperature: 0.7
      enabled: true
    - name: cerebras
      # Cerebras pruned their model list — llama-3.3-70b is gone.
      # qwen-3-235b is a 235B-MoE (active 22B/token) — strongest free model
      # on Cerebras now and adds genuine ensemble diversity vs Groq's Llama.
      # Alternative: gpt-oss-120b (OpenAI's open-weight model) for a different
      # lineage entirely.
      model: qwen-3-235b-a22b-instruct-2507
      weight: 0.20
      samples: 1
      max_tokens: 2000
      temperature: 0.7
      enabled: true

    # ─── Local Ollama (uncomment to use) ───────────────────────────────
    # Run `ollama serve` and `ollama pull deepseek-r1:32b` first, then
    # set OLLAMA_API_KEY=ollama in .env (any non-empty string). Frees you
    # from rate limits but adds ~30s per forecast on Mac M-series.
    # - name: ollama
    #   model: deepseek-r1:32b
    #   weight: 0.30
    #   samples: 1
    #   max_tokens: 2500
    #   temperature: 0.7
    #   enabled: true

    # ─── Paid providers (re-enable when accounts are funded) ───────────
    # Left here as enabled: false so historical diffs and Hermes tunings
    # remain coherent. Flip to true after topping up the corresponding
    # account at console.anthropic.com / platform.deepseek.com /
    # platform.moonshot.ai.
    - name: claude
      model: claude-sonnet-4-6
      weight: 0.50
      samples: 2
      max_tokens: 2000
      temperature: 0.7
      enabled: false                 # Account billing required (was empty)
    - name: deepseek
      model: deepseek-v4-flash
      weight: 0.30
      samples: 1
      max_tokens: 2500
      temperature: 0.7
      enabled: false                 # Account billing required
    - name: kimi
      model: kimi-k2-0905-preview
      weight: 0.20
      samples: 1
      max_tokens: 2000
      temperature: 0.7
      enabled: false                 # Account billing required

  llm_cache_ttl_minutes: 60          # Cache LLM results for unchanged markets

  # --- Ensemble Aggregation (Wave B) ---
  # How to combine N probability samples into one final estimate.
  #   auto             — trimmed_mean if N≥5 else weighted_geomean (default)
  #   weighted_geomean — legacy: log-odds weighted geomean (good at extremes)
  #   trimmed_mean     — Halawi 2024 NeurIPS optimal (drops outliers, weighted)
  #   median           — robust to extremes, weights ignored
  #   mean             — plain unweighted mean
  # Auto picks trimmed_mean only when there's enough samples for it to make
  # sense (≥5; trimming 1 from each tail leaves ≥3 in the middle).
  ensemble_aggregation: auto

  # Route LLM analysis through the `instructor` library for pydantic-validated
  # structured output (auto-retries on bad JSON). Falls back to the legacy
  # regex parse of raw text if instructor isn't installed OR the structured
  # call itself fails. Default on; set false to pin to the legacy path.
  use_instructor: true

  # --- Ensemble-Disagreement Kelly Dampener ---
  # When the LLM providers (Claude / DeepSeek / Kimi) disagree on a
  # market, size the Kelly bet down. The ensemble spread (max - min
  # probability across providers) is a revealed "I don't know" signal
  # across independent calibrations — it beats any single model's
  # self-reported confidence number.
  #
  # Linear ramp from full Kelly (1.0) at mild_threshold down to `kelly_floor`
  # at strong_threshold. With defaults:
  #   spread 0.05  → 1.00  (providers within 5 pts — full Kelly)
  #   spread 0.10  → 1.00  (at mild threshold)
  #   spread 0.15  → 0.75  (cut 25%)
  #   spread 0.20  → 0.50  (at strong threshold — half Kelly)
  #   spread 0.30+ → 0.50  (clamped at floor)
  #
  # The floor prevents dampening from vetoing a bet entirely — that's
  # the order gate's job. This block is sizing-only.
  disagreement:
    enabled: true
    mild_threshold: 0.10      # Below this, no dampening
    strong_threshold: 0.20    # At/above this, dampener clamped at floor
    kelly_floor: 0.5          # Minimum multiplier (half Kelly, floor)

  # --- Legacy single-Claude config (used as fallback if llm_providers is removed) ---
  llm_model: claude-sonnet-4-6
  max_tokens_per_analysis: 2000
  llm_ensemble_samples: 3
  llm_temperature: 0.7

# --- Scoring Thresholds ---
# Relaxed 2026-04-25 for Manifold paper-money calibration:
#   - min_edge 0.10 → 0.06: Manifold has no fee, so the 10% edge floor was
#     calibrated for Polymarket/Kalshi (4% fees + slippage). On a no-fee
#     play-money platform, 6% edge is plenty of margin. Hermes can re-tighten
#     once we move bankroll to a real-money platform.
#   - min_composite_score 7 → 5: empirically the bot was producing real
#     LLM forecasts but every market scored 4 because the score curve assumes
#     all four signals (base_rate + llm + news + market_consensus) point the
#     same direction. With only 1 LLM provider responding (Gemini was rate
#     limited), the spread compresses and scores cluster low. 5 is the floor
#     that admits a forecast where edge alone justifies the bet.
#   - min_confidence stays 0.60: this is provider-reported confidence and
#     doesn't change with sample count.
scoring:
  # composite_score = ev_score + cal_score + edg_score (each 0-3, total 0-9).
  # On a fresh Manifold-only setup the bot has:
  #   - cal_score ≈ 1 (no resolved trades yet → neutral Brier defaults to 0.5)
  #   - ev_score ≈ 1 (only LLM + market_consensus responding; no Metaculus/Kronos)
  # So even a market the LLM nails with +32% edge tops out at composite 4
  # (1 + 1 + 3). The 5 floor blocked everything; 4 admits real edges and lets
  # Hermes tighten as more trades resolve.
  min_composite_score: 4        # Relaxed 5→4 [HERMES: 4-8]
  min_edge: 0.06                # No-fee Manifold [HERMES: 0.04 - 0.20]
  # 2026-05-18: lifted 0.60 → 0.75 after the 39-trade trade_history.json
  # showed 71.8% WR but -$97 net (asymmetric loss: avg win $2, avg loss $77).
  # The data also showed below-median stakes had 88.9% WR vs above-median
  # 57.1%, i.e. the bot was sizing up on weaker-edge trades. Tightening the
  # confidence gate removes the bottom band of trades that were the
  # source of the asymmetric losses. Trade frequency expected to drop
  # ~50%; net P&L expected to flip positive on the same realized base rate.
  # Pair with kelly_multiplier 0.10 and max_per_market_pct 0.03 below.
  min_confidence: 0.75          # Reject "unsure" forecasts (was 0.60)

# --- Kelly Criterion Position Sizing ---
# 2026-05-18: tightened after asymmetric-loss diagnosis. The Virginia
# Redistricting trade alone took -$157 (4.4x median stake) on a marginal-
# edge bet that broke against us; the Hormuz duplicate took -$148 across
# two identical orders 60s apart. Lowering kelly_multiplier 0.20 → 0.10
# halves stake-on-edge; max_per_market_pct 0.08 → 0.03 caps absolute
# stake at 3% of bankroll regardless of edge claim — so a $1500 bankroll
# can never expose more than $45 to a single market. Worst-case loss
# per trade is now ~$45 instead of ~$157. Pair with the persistent 24h
# duplicate-blocker in order_gate.py to prevent the Hormuz repeat.
kelly_multiplier: 0.10          # Tenth Kelly until calibration proven (was 0.20)
max_per_market_pct: 0.03        # Hard cap at 3% of bankroll per market (was 0.08)
# Absolute dollar ceiling layered ON TOP of the percent cap. Even if the
# bankroll explodes, no single market gets more than this. Tune up only
# after 50+ resolved trades show Brier < 0.20 sustained.
max_stake_usd: 30.0             # Absolute per-market ceiling, dollars

# --- Market Preferences ---
markets:
  # Resolution date window — cut long-dated markets hard.
  # 60+ day bets are dead money: capital locked, little movement, high news
  # risk. The bot now strongly prefers 7-14 day resolutions and caps hard at 30.
  min_resolution_days: 1         # Don't trade markets resolving today (too volatile)
  # Relaxed 2026-04-25: was 15. The 15-day cap was rejecting ~20 of 81 Manifold
  # markets per scan, including the longer-dated political/macro markets that
  # have the biggest mispricings. 60 still keeps capital cycling and the
  # Gaussian preferred-resolution penalty (peak at 7d) means longer-dated
  # markets need *more* edge to score well, so they're not free entries.
  max_resolution_days: 60
  preferred_resolution_days: 7   # Score peak — Gaussian penalty outside this
  decay_resolution_days: 14      # Widened with the cap so 30d gets ~14% penalty, 60d ~57%
  resolution_score_weight: 0.15  # How much window-bias shifts composite score (0.0=off, 0.3=heavy)

  # --- Wave D: niche-market bias (polymarket-pipeline pattern) ---
  # Bias candidate selection toward the inefficient-edge sweet spot —
  # markets with enough liquidity to be tradeable but small enough that
  # sophisticated bots aren't dominating. polymarket-pipeline found
  # sub-$500K-volume markets had measurably more mispricing than whale
  # markets where edge is already arb'd away. Gaussian curve in log-volume
  # space, so it's symmetric in orders of magnitude.
  niche_preferred_volume: 50000   # USD 24h volume sweet spot
  niche_decay_octaves: 1.5        # σ of the Gaussian (in log2 octaves)
  niche_floor_score: 0.85         # Minimum multiplier (whale and dust both penalized to this)

  # Category preferences (can be weighted by Hermes)
  categories:
    - politics
    - economics
    - weather
    - crypto
    - sports
    - entertainment
    - ai_tech
    - geopolitical
    - science

  # Categories to avoid (updated by Hermes if consistently losing)
  avoid_categories: []

# --- Mechanical Strategies (from practitioner research) ---
# These bypass the forecasting engine — they're mathematically guaranteed or near-guaranteed.
# Priority order: NegRisk arb > Near-resolution harvest > Conviction bets.
mechanical:
  # NegRisk Arbitrage — guaranteed profit on multi-outcome markets
  # Practitioners: 36.2% ROI, 100% win rate. $29M extracted in one year.
  negrisk:
    enabled: true
    min_profit_pct: 0.025         # Min 2.5% profit after fees
    min_outcomes: 3               # Need 3+ outcomes
    min_liquidity: 500            # Min $500 volume across all outcomes
    max_exposure_per_event: 0.20  # Max 20% of bankroll per NegRisk event

  # Near-Resolution Harvesting — markets about to resolve with near-certain outcome
  # Practitioners: 5.8% ROI, 100% win rate
  #
  # The harvester bypasses the forecasting engine + agent consensus because
  # the math is transparent — a 95c contract resolving in 4h has ~5% certain
  # upside. It STILL goes through the order gate (propose → validate →
  # execute) so circuit breakers + dedup + audit trail apply normally.
  #
  # Sizing is fixed-fraction (not Kelly) with two caps:
  #   max_position_pct      — per harvester position (of bankroll)
  #   max_total_exposure_pct — across all open harvester positions
  # These stay UNDER circuit_breakers.max_per_market_pct in settings.yaml
  # so the breaker never trips on our own sizing — that's the intent.
  near_resolution:
    enabled: true
    max_hours_to_resolution: 24   # Within 24 hours
    min_price: 0.92               # Market must be 92%+ certain
    min_profit_after_fees: 0.005  # At least 0.5% profit after fees
    max_position_pct: 0.05        # Max 5% of bankroll per harvester position
    max_total_exposure_pct: 0.20  # Max 20% of bankroll across all harvester positions

  # Smart Money Signals — track high-performing wallets as trade signals
  smart_money:
    enabled: false                # Enable when wallet tracking is built
    min_win_rate: 0.60            # 60%+ win rate required
    min_trades: 100               # 100+ trade history
    min_account_age_days: 120     # 4+ months

# --- Market Selection Filters (from AI ensemble practitioners) ---
market_filters:
  min_liquidity: 100              # M$100 for Manifold paper trading (raise for real money)
  # Relaxed 2026-04-25: was 10. Combined with the 15d resolution cap, this was
  # killing 54 of 81 markets/scan. 5 admits very-thin markets but the LLM gate
  # downstream + max_per_market_pct (8% bankroll) still bound the risk.
  min_volume_24h: 5
  min_hours_to_resolution: 48     # At least 48h remaining
  price_bounds: [0.10, 0.90]      # Avoid extreme odds
  max_spread_pct: 0.05            # Tight: wide spreads eat the edge on entry
  max_markets_per_cycle: 20       # Control inference costs
  min_edge_for_conviction: 0.10   # 10%+ edge for conviction bets
  # --- New defensive filters ---
  max_positions_same_category: 2  # Prevents 4 simultaneous "election" bets correlating into one loss
  adverse_selection_edge: 0.40    # Edge > 40% triggers second-pass review (the market is usually right)
  min_book_depth_usd: 500         # Don't bet into a 3-trader market — slippage eats alpha on exit

# --- Exit Strategy ---
exits:
  stop_loss_pct: 0.25            # Sell if position drops 25% from entry
  take_profit_price: 0.95         # Sell if price hits 95c
  early_exit_threshold: 0.15     # Take profit if position gained 15% [HERMES: 0.05 - 0.25]
  edge_gone_buffer: 0.03          # Sell if market moved past our estimate +/- 3%
  price_drift_alert: 0.10        # Alert if market moved 10% against us
  stale_position_hours: 24       # Flag positions with no market activity in 24h
  cooldown_cycles_after_close: 2  # Block re-entry for 2 scan cycles after exiting

  # --- Reforecast-based Exit (Phase B) ---
  # The static `edge_gone_buffer` compares market drift against the
  # probability we estimated AT ENTRY. That misses the case where new
  # information (news, a correlated market moving, base-rate shift) has
  # invalidated our original forecast even if the market price hasn't
  # caught up yet. This block re-runs the full forecast pipeline on open
  # positions and exits when our *current* best estimate says the edge
  # is gone or flipped against us.
  #
  # Cost control: each reforecast burns an LLM+news+Metaculus call, so
  # the gates below throttle hard. Even with 10 open positions, at a
  # 30-minute reforecast cadence that's ~20 ensemble calls per hour.
  reforecast:
    enabled: true
    min_age_minutes: 30            # Don't reforecast a position opened <30min ago
    min_interval_minutes: 30       # Min time between reforecasts on same position
    min_price_drift: 0.03          # Skip reforecast unless market moved >=3% since entry
    flipped_threshold: -0.03       # Exit (advisory) if reforecast edge < -3% after fees
    strong_against_threshold: -0.10 # Exit (immediate) if reforecast edge < -10%
    llm_enabled: true              # Set false for news+Metaculus-only (cheap) reforecasts

  # --- Auto-Exit Execution ---
  # Default is SIGNAL-ONLY: the monitor detects, logs, and prints exit signals
  # but never trades. Operator closes manually. Finance-grade default — keep
  # human in the loop until the bot has a calibrated track record.
  #
  # When enabled, the monitor dispatches on signal.reason (immediate-urgency only):
  #   resolved                   → resolution_tracker.settle_position (mark + P/L)
  #   stop_loss                  → client.close_position() at market
  #   take_profit                → client.close_position() at market
  #   reforecast_strong_against  → client.close_position() at market
  # Advisory signals (early_exit, edge_gone, reforecast_edge_gone, price_drift,
  # stale, market_not_found) are NEVER auto-executed — they're opinions.
  #
  # max_per_cycle caps cascading exits — a bad cycle shouldn't dump the book.
  # min_seconds_between_attempts throttles retries when close_position fails
  # repeatedly on the same market (don't spam the exchange).
  auto_exit:
    enabled: false                 # Off by default — keep human in the loop
    max_per_cycle: 3               # Max positions closed per monitor cycle
    min_seconds_between_attempts: 300  # Cool-off per position after a failed close

# --- Growth Mode ($50 → $25k) ---
growth:
  # Phase auto-graduates off live bankroll (lib/phase.effective_phase).
  # The integer below is a fallback used only if phase_thresholds is removed.
  phase: 2                      # legacy fallback; ignored when phase_thresholds set
  phase_thresholds:             # bankroll floor to enter each phase
    - {phase: 1, min_bankroll: 0}        # Survival ($0-$200)
    - {phase: 2, min_bankroll: 200}      # Acceleration ($200-$2k)
    - {phase: 3, min_bankroll: 2000}     # Scaling ($2k-$10k)
    - {phase: 4, min_bankroll: 10000}    # Preservation ($10k+)
  phase_caps:                   # max_concurrent_positions per phase
    1: 3                        # concentrated, high-conviction
    2: 8                        # acceleration: more slots
    3: 15                       # scaling: portfolio diversification
    4: 25                       # preservation: spread risk
  # Legacy single-cap (used if phase_caps is removed). Keep in sync with
  # phase_caps[effective_phase] so behavior is identical during migration.
  max_concurrent_positions: 8
  compound_all_profits: true    # Never withdraw during growth
  prefer_fast_resolution: true  # Bias toward markets resolving in 1-14 days

# --- Hermes Bounds (safety limits for auto-tuning) ---
hermes_bounds:
  min_edge:              [0.05, 0.20]
  kelly_multiplier:      [0.10, 0.75]
  min_composite_score:   [4, 8]
  llm_weight:            [0.10, 0.50]
  base_rate_weight:      [0.10, 0.50]
  metaculus_weight:       [0.05, 0.40]
  news_weight:           [0.05, 0.30]
  kronos_weight:         [0.05, 0.40]
  smart_money_weight:    [0.05, 0.25]
  early_exit_threshold:  [0.05, 0.25]
  max_per_market_pct:    [0.05, 0.20]

# --- Kronos Zero-Shot Forecasting ---
kronos:
  enabled: true
  model_name: "NeoQuasar/Kronos-base"           # 102M params, good balance
  tokenizer_name: "NeoQuasar/Kronos-Tokenizer-base"
  max_context: 512
  default_lookback: 400
  default_pred_bars: 30
  sample_count: 10                               # MC samples for probability
  temperature: 0.8
  cache_ttl_minutes: 60

# --- Negation-pair arbitrage (T1.1, 2026-04-26) ---
# Adapted from PolySwarm (Barot & Borkhatariya 2026, arXiv:2604.03888v1).
# Detects mutually-exclusive market sets whose probabilities don't sum to
# 1.0 — guaranteed positive EV ignoring fees and execution risk.
negation_arb:
  enabled: true
  autodetect_enabled: true
  # Sum gap thresholds: |1.0 - sum_probs| must exceed these to qualify.
  # Explicit groups have a lower bar (we trust the user's labeling).
  min_gap: 0.05                  # 5% gap for explicit groups
  min_gap_autodetect: 0.08       # 8% for auto-grouped (compensates heuristic noise)
  # Auto-detect grouping params
  min_shared_slugs: 2            # Markets must share 2+ Manifold groupSlugs
  min_group_size: 2
  max_group_size: 6              # Larger groups are usually loose categories, not exclusive sets
  # Sizing
  kelly_fraction: 0.25           # Quarter-Kelly on the gap (conservative)
  max_total_pct: 0.30            # Hard cap: arb position cluster <= 30% bankroll

  # Explicit user-declared mutually-exclusive groups (highest confidence).
  # When these exist, they ALWAYS get checked first regardless of slug matching.
  # Format: [{group_id: "name", market_ids: [<id1>, <id2>, ...]}]
  explicit_groups: []
