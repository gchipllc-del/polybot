<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Polybot">
    <title>Polybot Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; color: #c9d1d9; font-family: 'Menlo', 'Consolas', monospace; font-size: 14px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { color: #ffd700; text-align: center; margin-bottom: 20px; font-size: 22px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
        .card h2 { color: #58a6ff; font-size: 14px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .card.full { grid-column: 1 / -1; }
        .stat { display: inline-block; margin-right: 24px; margin-bottom: 8px; }
        .stat .label { color: #8b949e; font-size: 12px; }
        .stat .value { color: #c9d1d9; font-size: 18px; font-weight: bold; }
        .stat .value.positive { color: #3fb950; }
        .stat .value.negative { color: #f85149; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge.paper { background: #b5890055; color: #ffd700; }
        .badge.live { background: #f8514955; color: #f85149; }
        .badge.ok { background: #3fb95033; color: #3fb950; }
        .badge.warn { background: #d2992255; color: #d29922; }
        .badge.trip { background: #f8514955; color: #f85149; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #8b949e; font-size: 12px; padding: 8px 6px; border-bottom: 1px solid #30363d; }
        td { padding: 8px 6px; border-bottom: 1px solid #21262d; }
        .refresh-bar { text-align: center; color: #8b949e; font-size: 12px; margin-top: 16px; }
        .refresh-bar button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 4px 12px; border-radius: 4px; cursor: pointer; margin-left: 8px; }
        .chart-container { height: 250px; }
        .breaker-bar { background: #21262d; border-radius: 4px; height: 16px; margin: 4px 0; overflow: hidden; }
        .breaker-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
        .event { padding: 4px 0; border-bottom: 1px solid #21262d; font-size: 12px; }
        .event .ts { color: #8b949e; }
        .event .action { color: #58a6ff; }

        /* Mobile (phone) support */
        /* min-width: 0 lets cards shrink below their content's natural width, so
           wide tables scroll inside .table-scroll instead of stretching the page. */
        .grid > .card { min-width: 0; }
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table-scroll table { min-width: 720px; }

        @media (max-width: 700px) {
            .grid { grid-template-columns: 1fr; gap: 12px; }
            .container { padding: 10px; }
            .card { padding: 12px; }
            .stat { margin-right: 16px; }
            .chart-container { height: 220px; }
            .refresh-bar button { padding: 10px 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>POLYBOT &mdash; Prediction Market Trader</h1>

    <!-- Portfolio Summary -->
    <div class="grid">
        <div class="card full" id="portfolio-card">
            <h2>Portfolio</h2>
            <div id="portfolio-stats">Loading...</div>
        </div>
    </div>

    <!-- Positions + Chart -->
    <div class="grid">
        <div class="card full">
            <h2>Open Positions</h2>
            <div class="table-scroll">
            <table id="positions-table">
                <thead>
                    <tr><th>Side</th><th>Question</th><th>Platform</th><th>Invested</th><th>Bets</th><th>Entry</th><th>Current</th><th>P/L</th><th>Edge</th><th>Score</th><th>Resolves</th></tr>
                </thead>
                <tbody id="positions-body"><tr><td colspan="11">Loading...</td></tr></tbody>
            </table>
            </div>
        </div>
    </div>

    <div class="grid">
        <!-- P/L Chart -->
        <div class="card">
            <h2>Cumulative P/L</h2>
            <div class="chart-container"><canvas id="pl-chart"></canvas></div>
        </div>

        <!-- Circuit Breakers -->
        <div class="card">
            <h2>Circuit Breakers</h2>
            <div id="breakers-container">Loading...</div>
        </div>
    </div>

    <div class="grid">
        <!-- Performance -->
        <div class="card">
            <h2>Performance</h2>
            <div id="performance-stats">Loading...</div>
        </div>

        <!-- Calibration -->
        <div class="card">
            <h2>Calibration</h2>
            <div id="calibration-stats">Loading...</div>
        </div>
    </div>

    <!-- Recent Events -->
    <div class="grid">
        <div class="card full">
            <h2>Recent Events</h2>
            <div id="events-container">Loading...</div>
        </div>
    </div>

    <div class="refresh-bar">
        Auto-refresh: <span id="countdown">30</span>s
        <button onclick="togglePause()">Pause</button>
        <button onclick="refreshNow()">Refresh Now</button>
    </div>
</div>

<script>
let plChart = null;
let paused = false;
let countdown = 30;

function fmt(n, decimals=2) { return n != null ? Number(n).toFixed(decimals) : '-'; }
function pnlClass(n) { return n >= 0 ? 'positive' : 'negative'; }
function pnlSign(n) { return n >= 0 ? '+' + fmt(n) : fmt(n); }

async function fetchData() {
    try {
        const res = await fetch('/api/state');
        const data = await res.json();
        renderPortfolio(data.portfolio);
        renderPositions(data.positions);
        renderBreakers(data.breakers);
        renderPerformance(data.performance);
        renderCalibration(data.calibration);
        renderEvents(data.events);
        renderPLChart(data.history);
    } catch(e) {
        console.error('Fetch error:', e);
    }
}

function renderPortfolio(p) {
    if (!p || p.error) { document.getElementById('portfolio-stats').innerHTML = 'Error: ' + (p?.error || 'unknown'); return; }
    const modeBadge = p.mode === 'manifold' ? '<span class="badge paper">PAPER</span>' : '<span class="badge live">LIVE</span>';
    const calClass = {Excellent:'ok',Good:'ok',Fair:'warn',Poor:'trip'}[p.calibration_grade] || '';
    const lifetimeTitle = `title="Realized $${fmt(p.realized_pnl)} + Unrealized $${fmt(p.unrealized_pnl)}"`;
    document.getElementById('portfolio-stats').innerHTML = `
        <div class="stat"><div class="label">Bankroll</div><div class="value">$${fmt(p.total_bankroll)}</div></div>
        <div class="stat"><div class="label">Cash</div><div class="value">$${fmt(p.cash_balance)}</div></div>
        <div class="stat"><div class="label">Positions</div><div class="value">$${fmt(p.position_value)}</div></div>
        <div class="stat" ${lifetimeTitle}><div class="label">Lifetime P/L</div><div class="value ${pnlClass(p.lifetime_pnl)}">${pnlSign(p.lifetime_pnl)}</div></div>
        <div class="stat"><div class="label">Open P/L</div><div class="value ${pnlClass(p.unrealized_pnl)}">${pnlSign(p.unrealized_pnl)}</div></div>
        <div class="stat"><div class="label">Mode</div><div class="value">${modeBadge}</div></div>
        <div class="stat"><div class="label">Phase</div><div class="value">${p.phase}</div></div>
        <div class="stat"><div class="label">Kelly</div><div class="value">${(p.kelly_multiplier*100).toFixed(0)}%</div></div>
        <div class="stat"><div class="label">Calibration</div><div class="value"><span class="badge ${calClass}">${p.calibration_grade}</span></div></div>
    `;
}

function renderPositions(positions) {
    const tbody = document.getElementById('positions-body');
    if (!positions || positions.length === 0) { tbody.innerHTML = '<tr><td colspan="11" style="color:#8b949e">No open positions</td></tr>'; return; }
    const open = positions.filter(p => p.status === 'open');
    if (open.length === 0) { tbody.innerHTML = '<tr><td colspan="11" style="color:#8b949e">No open positions</td></tr>'; return; }
    tbody.innerHTML = open.map(p => {
        const res = p.resolution_countdown || {};
        const resLabel = res.label || '—';
        let resStyle = 'color:#8b949e';
        if (resLabel === 'RESOLVING') resStyle = 'color:#d29922;font-weight:bold';
        else if (res.days != null && res.days < 3) resStyle = 'color:#d29922;font-weight:bold';
        else if (res.days != null && res.days < 14) resStyle = 'color:#58a6ff';
        const resTitle = res.iso ? `title="Resolves ${res.iso}"` : '';
        const edge = p.edge_at_entry != null ? (p.edge_at_entry*100).toFixed(0) + '%' : '—';
        const edgeStyle = p.edge_at_entry > 0 ? 'color:#3fb950' : '';
        return `
        <tr>
            <td style="font-weight:bold">${p.side}</td>
            <td>${p.question}</td>
            <td style="color:#8b949e">${p.platform}</td>
            <td>$${fmt(p.total_invested, 0)}</td>
            <td style="text-align:center">${p.bet_count || 1}</td>
            <td>$${fmt(p.entry_price)}</td>
            <td>$${fmt(p.current_price)}</td>
            <td class="${pnlClass(p.pnl)}">${pnlSign(p.pnl)} <span style="color:#8b949e;font-size:11px">(${(p.pnl_pct*100).toFixed(1)}%)</span></td>
            <td style="${edgeStyle}">${p.edge_at_entry > 0 ? '+' : ''}${edge}</td>
            <td>${p.composite_score}/9</td>
            <td style="${resStyle}" ${resTitle}>${resLabel}</td>
        </tr>
    `;}).join('');
}

function renderBreakers(cb) {
    const container = document.getElementById('breakers-container');
    if (!cb || cb.error) { container.innerHTML = 'Error'; return; }
    const b = cb.breakers || {};
    let html = '';
    for (const [name, data] of Object.entries(b)) {
        const pct = Math.min(data.pct_used * 100, 100);
        const color = data.tripped ? '#f85149' : pct > 60 ? '#d29922' : '#3fb950';
        const label = name.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        const statusBadge = data.tripped ? '<span class="badge trip">TRIPPED</span>' : pct > 60 ? '<span class="badge warn">WARNING</span>' : '<span class="badge ok">OK</span>';
        html += `<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><span>${label}</span><span>${statusBadge} ${data.current} / ${data.limit}</span></div><div class="breaker-bar"><div class="breaker-fill" style="width:${pct}%;background:${color}"></div></div></div>`;
    }
    const paperBadge = cb.paper_mode ? '<span class="badge paper">PAPER MODE</span>' : '<span class="badge live">LIVE</span>';
    html += `<div style="margin-top:12px">${paperBadge}</div>`;
    container.innerHTML = html;
}

function renderPerformance(perf) {
    const el = document.getElementById('performance-stats');
    if (!perf || perf.total_trades === 0) { el.innerHTML = '<span style="color:#8b949e">No completed trades yet</span>'; return; }
    el.innerHTML = `
        <div class="stat"><div class="label">Trades</div><div class="value">${perf.total_trades}</div></div>
        <div class="stat"><div class="label">Win Rate</div><div class="value ${perf.win_rate>=0.55?'positive':'negative'}">${(perf.win_rate*100).toFixed(0)}%</div></div>
        <div class="stat"><div class="label">Total P/L</div><div class="value ${pnlClass(perf.total_pnl)}">${pnlSign(perf.total_pnl)}</div></div>
        <div class="stat"><div class="label">Avg Win</div><div class="value positive">+${fmt(perf.avg_win)}</div></div>
        <div class="stat"><div class="label">Avg Loss</div><div class="value negative">${fmt(perf.avg_loss)}</div></div>
        <div class="stat"><div class="label">Fees Paid</div><div class="value">$${fmt(perf.total_fees)}</div></div>
    `;
}

function renderCalibration(cal) {
    const el = document.getElementById('calibration-stats');
    if (!cal || cal.brier_score == null) { el.innerHTML = '<span style="color:#8b949e">No resolved forecasts yet</span>'; return; }
    let html = `
        <div class="stat"><div class="label">Brier Score</div><div class="value">${fmt(cal.brier_score,4)}</div></div>
        <div class="stat"><div class="label">Log Loss</div><div class="value">${fmt(cal.log_loss,4)}</div></div>
    `;
    const sa = cal.source_accuracy || {};
    if (Object.keys(sa).length > 0) {
        html += '<div style="margin-top:8px"><span class="label">Source Accuracy:</span></div>';
        for (const [src, data] of Object.entries(sa)) {
            html += `<div style="font-size:12px;margin-left:8px">${src}: Brier=${fmt(data.brier,4)} (n=${data.count})</div>`;
        }
    }
    el.innerHTML = html;
}

function renderEvents(events) {
    const container = document.getElementById('events-container');
    if (!events || events.length === 0) { container.innerHTML = '<span style="color:#8b949e">No events</span>'; return; }
    container.innerHTML = events.slice(0, 15).map(e => `
        <div class="event">
            <span class="ts">${(e.timestamp||'').substring(11,19)}</span>
            <span class="action">${e.action}</span>
            <span>${e.summary || ''}</span>
        </div>
    `).join('');
}

function renderPLChart(history) {
    if (!history || !history.pl_series || history.pl_series.length === 0) return;
    const ctx = document.getElementById('pl-chart').getContext('2d');
    const labels = history.pl_series.map(p => p.date);
    const data = history.pl_series.map(p => p.pl);

    if (plChart) plChart.destroy();
    plChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Cumulative P/L ($)',
                data: data,
                borderColor: '#58a6ff',
                backgroundColor: 'rgba(88, 166, 255, 0.1)',
                fill: true,
                tension: 0.3,
                pointRadius: 3,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
                y: { ticks: { color: '#8b949e', callback: v => '$'+v }, grid: { color: '#21262d' } }
            },
            plugins: { legend: { labels: { color: '#c9d1d9' } } }
        }
    });
}

function togglePause() { paused = !paused; }
function refreshNow() { countdown = 0; }

// Auto-refresh
setInterval(() => {
    if (paused) return;
    countdown--;
    document.getElementById('countdown').textContent = countdown;
    if (countdown <= 0) { fetchData(); countdown = 30; }
}, 1000);

// Initial load
fetchData();
</script>
</body>
</html>
